# Teleply iOS (遥应). XcodeGen turns this into Teleply.xcodeproj on the build machine (scripts/ci-common.sh);
# the generated project is not kept in git. Settings that a new Xcode project would get from its template are
# written out here, because XcodeGen does not add them.
name: Teleply
options:
  bundleIdPrefix: com.pocketagentdesk
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEAD_CODE_STRIPPING: YES
packages:
  TeleplyCore:
    path: TeleplyCore
targets:
  Teleply:
    type: application
    platform: iOS
    sources:
      - path: Teleply
    dependencies:
      - package: TeleplyCore
        product: TeleplyModel
      - package: TeleplyCore
        product: TeleplyState
      - package: TeleplyCore
        product: TeleplyDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketagentdesk.teleply
        PRODUCT_NAME: Teleply
        INFOPLIST_FILE: Teleply/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Accent
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
  TeleplyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TeleplyUITests
    dependencies:
      - target: Teleply
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketagentdesk.teleply.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: Teleply
schemes:
  Teleply:
    build:
      targets:
        Teleply: all
        TeleplyUITests: [test]
    test:
      config: Debug
      targets:
        - TeleplyUITests
    archive:
      config: Release
