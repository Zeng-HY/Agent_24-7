<section id="auth" class="card" aria-labelledby="title"><h1 id="title">登录</h1><p id="sentTo" class="sent-to" hidden></p><form id="form">
<div id="emailField" class="field"><input id="name" name="username" placeholder=" " autocomplete="username" autocapitalize="none" spellcheck="false" required><label for="name">邮箱或账号</label></div>
<div id="codeField" class="field" hidden><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder=" "><label for="code">验证码</label></div>
<div id="passwordField" class="field password-wrap"><input id="password" name="password" type="password" placeholder=" " autocomplete="current-password" required><label for="password">密码</label><button id="reveal" class="reveal" type="button" aria-label="显示密码" aria-pressed="false">显示</button></div>
<button id="submit" class="primary" type="submit">登录</button></form><button id="resend" class="text-button" type="button" hidden>重新发送</button><div class="links"><button id="forgot" class="text-button" type="button">忘记密码？</button><button id="mode" class="text-button" type="button">创建账号</button><span id="closed" class="closed" hidden>暂未开放注册</span></div></section>
<section id="signed" class="card devices-card" hidden><div class="section-head"><h1>我的电脑</h1><button id="menuButton" class="icon-button" aria-label="账号菜单" aria-expanded="false">⋯</button></div>
<dialog id="menu" class="action-menu" aria-label="账号菜单"><button data-action="email">关联邮箱</button><button data-action="password">修改密码</button><button data-action="logout">退出登录</button></dialog><dialog id="deviceMenu" class="action-menu" aria-label="电脑操作"></dialog><ul id="devices"></ul><p id="empty" class="muted" hidden>暂无电脑</p>
<div id="approval" hidden><h2 id="computerName"></h2><div id="existingField" class="field static"><select id="existing"><option value="">新增电脑</option></select><label for="existing">绑定方式</label></div><button id="approve" class="primary">绑定这台电脑</button></div></section>
<p id="message" role="status" aria-live="polite"></p><dialog id="dialog"><form id="dialogForm"><h2 id="dialogTitle"></h2><p id="dialogDescription" hidden></p><div id="dialogFields"></div><p id="dialogMessage" role="alert"></p><div class="dialog-actions"><button id="cancel" type="button" class="secondary">取消</button><button id="confirm" class="primary" type="submit">确定</button></div></form></dialog></main><script src="/account/ui.js" defer></script></body></html>
