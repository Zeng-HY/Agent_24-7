<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f6f6"><title>Agent Remote</title><link rel="stylesheet" href="/account/ui.css"></head>
<body><main><a class="brand" href="/account"><span class="mark" aria-hidden="true">A</span>Agent Remote</a>
<section id="auth" class="card" aria-labelledby="title"><h1 id="title">登录</h1><form id="form">
<div id="emailField" class="field"><label for="name">邮箱或账号</label><input id="name" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
<div id="passwordField" class="field"><label for="password">密码</label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" required><button id="reveal" class="reveal" type="button" aria-label="显示密码" aria-pressed="false">显示</button></div></div>
<button id="submit" class="primary" type="submit">登录</button></form><button id="resend" class="text-button" type="button" hidden>重新发送验证邮件</button><button id="forgot" class="text-button" type="button">忘记密码？</button><div class="divider"></div><button id="mode" class="text-button" type="button">创建账号</button></section>
<section id="signed" class="card devices-card" hidden><div class="section-head"><h1>我的电脑</h1><button id="menuButton" class="icon-button" aria-label="账号菜单" aria-expanded="false">⋯</button></div>
<div id="menu" class="menu" hidden><button data-action="email">关联邮箱</button><button data-action="password">修改密码</button><button data-action="logout">退出登录</button></div><ul id="devices"></ul><p id="empty" class="muted" hidden>暂无电脑</p>
<div id="approval" hidden><h2 id="computerName"></h2><label class="field" for="existing">绑定方式<select id="existing"><option value="">新增电脑</option></select></label><button id="approve" class="primary">绑定这台电脑</button></div></section>
<p id="message" role="status" aria-live="polite"></p><dialog id="dialog"><form id="dialogForm"><h2 id="dialogTitle"></h2><div id="dialogFields"></div><p id="dialogMessage" role="alert"></p><div class="dialog-actions"><button id="cancel" type="button" class="secondary">取消</button><button id="confirm" class="primary" type="submit">确定</button></div></form></dialog></main><script src="/account/ui.js" defer></script></body></html>
