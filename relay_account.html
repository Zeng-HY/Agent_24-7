<!doctype html><html lang="zh-CN"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Remote 账号</title>
<style>body{font:16px/1.6 system-ui;max-width:620px;margin:36px auto;padding:20px;color:#182333}input,button{font:inherit;padding:10px;margin:5px;max-width:90%}fieldset{margin:18px 0;border:1px solid #ccc;border-radius:8px}button{cursor:pointer}#message{white-space:pre-wrap}li{margin:12px 0}</style>
<h1>Agent Remote</h1><p>仅限受邀用户。每个账号只能连接自己绑定的电脑。</p>
<fieldset><legend>登录 / 邀请注册</legend><input id="name" autocomplete="username" placeholder="账号">
<input id="password" type="password" autocomplete="current-password" placeholder="密码（至少 12 个字符）">
<input id="code" type="password" autocomplete="off" placeholder="邀请或重置码">
<button id="login">登录</button><button id="register">受邀注册</button><button id="reset">重置密码</button></fieldset>
<section id="signed" hidden><h2>我的电脑</h2><p>选择电脑会切换此浏览器的全部标签页。切换前请关闭其他遥控页。</p><ul id="devices"></ul>
<button id="bind">生成十分钟绑定码</button><button id="logout">退出登录</button>
<p>在需要绑定的电脑运行接入命令，核对账号和服务器后确认。新电脑需管理员启用专属隧道。</p>
<fieldset><legend>修改密码（所有登录会话立即退出）</legend><input id="old" type="password" autocomplete="current-password" placeholder="当前密码">
<input id="new" type="password" autocomplete="new-password" placeholder="新密码"><button id="change">修改密码</button></fieldset>
<p id="usage"></p></section><p id="message" role="status"></p>
<script>
const $=id=>document.getElementById(id), say=x=>$('message').textContent=x;
function readLink(){const fragment=new URLSearchParams(location.hash.slice(1));$('code').value=fragment.get('invite')||fragment.get('reset')||'';history.replaceState(null,'','/account')}
readLink();window.addEventListener('hashchange',readLink);
async function api(action,data={}){const r=await fetch('/account/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let v={};try{v=await r.json()}catch{}if(!r.ok)throw Error(v.error||'操作失败，请重新登录后重试');return v}
async function state(){const r=await fetch('/account/state');$('signed').hidden=!r.ok;if(!r.ok)return;const s=await r.json();$('devices').replaceChildren();for(const d of s.devices){const li=document.createElement('li');li.append(document.createTextNode(d.label+' '));for(const [label,action] of [['连接','select'],['撤销','revoke']]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>run(async()=>{if(action==='revoke'&&!confirm('撤销这台电脑的中转访问？'))return;await api(action,{id:d.id});if(action==='select')location.assign('/');else await state()});li.append(b)}$('devices').append(li)}const bytes=s.usage.reduce((n,x)=>n+x.uploads+x.downloads,0);$('usage').textContent='已记录的转发数据：'+(bytes/1048576).toFixed(2)+' MiB（应用层计数，不是云账单）'}
async function run(fn){try{await fn()}catch(e){say(e.message)}}
for(const action of ['login','register','reset'])$(action).onclick=()=>run(async()=>{await api(action,{name:$('name').value,password:$('password').value,code:$('code').value});$('password').value='';$('code').value='';say(action==='login'?'已登录':'已完成，请登录');await state()});
$('logout').onclick=()=>run(async()=>{await api('logout');say('已退出');await state()});
$('bind').onclick=()=>run(async()=>{const v=await api('bind');say('绑定码（仅输入到自己的电脑，十分钟有效）：\n'+v.code)});
$('change').onclick=()=>run(async()=>{await api('password',{old:$('old').value,password:$('new').value});$('old').value='';$('new').value='';say('密码已修改，请重新登录');await state()});
run(state);
</script></html>
