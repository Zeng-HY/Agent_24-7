<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#ffffff">
<title>Pocket Agent Desk</title><link rel="stylesheet" href="app.css"></head>
<body><main>
<header class="brand"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#111113"/><path d="M8.05 22.56L15.01 8.12A0.44 0.44 0 0 1 15.4 7.88L16.6 7.88A0.44 0.44 0 0 1 16.99 8.12L23.95 22.56A0.44 0.44 0 0 1 23.55 23.19L21.2 23.19A0.44 0.44 0 0 1 20.8 22.94L16.39 13.79A0.44 0.44 0 0 0 15.61 13.79L11.2 22.94A0.44 0.44 0 0 1 10.8 23.19L8.45 23.19A0.44 0.44 0 0 1 8.05 22.56Z" fill="#fff"/><circle cx="16" cy="18.88" r="1.62" fill="#fff"/></svg><span>Agent Remote</span></header>
<form id="connect" class="connection-card">
<button id="open" type="submit" class="primary">登录</button>
<details><summary>连接设置</summary><div class="settings">
<label for="origin">服务地址</label><input id="origin" type="url" required autocomplete="url" spellcheck="false" inputmode="url">
<label for="entry">打开页面</label><select id="entry"><option value="account">账号与电脑</option><option value="home">继续已选择的电脑</option></select>
<button id="compat" type="submit" class="text-button" hidden>使用系统浏览器打开</button>
<button id="forget" type="button" class="text-button">恢复默认设置</button>
<button id="update" type="button" class="text-button" hidden>检查 App 更新</button>
</div></details></form>
<p id="status" class="status" role="status" aria-live="polite"></p>

</main><script type="module" src="app.js"></script></body></html>
