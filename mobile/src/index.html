<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Pocket Agent Desk</title><link rel="stylesheet" href="app.css"></head>
<body><main><p class="eyebrow">AGENT REMOTE · 移动端</p><h1>Pocket Agent Desk</h1>
<p>连接自己的电脑，继续桌面上的工作。</p>
<form id="connect"><label for="origin">HTTPS 服务地址</label>
<input id="origin" type="url" required autocomplete="url" spellcheck="false" inputmode="url">
<label for="entry">服务入口</label><select id="entry"><option value="home">当前遥控入口</option><option value="account">多用户账号入口</option></select>
<p class="hint">多用户入口需服务器完成部署。登录及设备选择在服务器页面完成。</p>
<button id="open" type="submit">打开服务</button>
<button id="compat" type="submit" class="secondary" hidden>兼容登录（系统浏览器）</button>
<button id="forget" type="button" class="secondary">恢复默认地址</button></form>
<p id="status" role="status" aria-live="polite"></p>
<p class="hint">请核对服务地址后登录。此启动页只保存地址和入口；退出账号请在服务页面操作。关闭顶部浏览器即可返回。</p>
</main><script type="module" src="app.js"></script></body></html>
