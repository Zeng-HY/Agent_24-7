<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>输入诊断</title><style>body{font:16px/1.6 -apple-system,"Microsoft YaHei",sans-serif;margin:24px;color:#1d2330;background:white}textarea{box-sizing:border-box;width:100%;font:inherit;min-height:160px;border:1px solid #ddd;border-radius:12px;padding:12px}input,button{font:inherit;padding:10px;margin:8px 0}pre{white-space:pre-wrap;font:12px/1.5 monospace;max-height:300px;overflow:auto}a{color:#2563eb}label{display:block}</style></head><body>
<h2>原生输入框测试</h2><p>这里没有聊天轮询、固定底栏或自动焦点恢复。请分别测试搜狗语音和系统听写。</p><textarea id="plain" placeholder="在这里测试输入"></textarea>
<label>iOS 版本 <input id="ios" placeholder="请填写系统版本"></label><label>搜狗版本 <input id="sogou" placeholder="请填写输入法版本"></label><button id="view">查看诊断事件</button><button id="clear">清空事件记录</button><pre id="events"></pre>
<p><a href="/?input_test=pause">聊天页暂停刷新测试</a></p><p><a href="/?input_test=trace">聊天页正常刷新测试</a></p><p><a href="/">返回遥控网页</a></p>
<script>const field=document.getElementById('plain'),events=[];function record(e){events.push({time:Math.round(performance.now()),event:e.type,inputType:e.inputType||null,composing:e.isComposing||false,length:field.value.length,focused:document.activeElement===field,selection:[field.selectionStart,field.selectionEnd],visible:document.visibilityState,height:visualViewport?.height,top:visualViewport?.offsetTop});if(events.length>300)events.shift();}['focus','blur','beforeinput','input','compositionstart','compositionupdate','compositionend'].forEach(e=>field.addEventListener(e,record));['pageshow','pagehide','focus','blur'].forEach(e=>window.addEventListener(e,record));document.addEventListener('visibilitychange',record);if(window.visualViewport){visualViewport.addEventListener('resize',record);visualViewport.addEventListener('scroll',record);}document.getElementById('view').onclick=()=>document.getElementById('events').textContent=JSON.stringify({version:'0.7.0',standalone:!!navigator.standalone||matchMedia('(display-mode: standalone)').matches,userAgent:navigator.userAgent,ios:document.getElementById('ios').value,sogou:document.getElementById('sogou').value,events},null,2);document.getElementById('clear').onclick=()=>{events.length=0;document.getElementById('events').textContent='';};</script></body></html>
