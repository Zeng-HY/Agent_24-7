<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><title>Agent Remote</title>
<style>
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#171719;background:#fff}*{box-sizing:border-box}body{margin:0;padding:32px;min-width:340px}.brand{font-size:16px;font-weight:600;display:flex;align-items:center;gap:10px}.brand i{font-style:normal;background:#171719;color:white;border-radius:10px;padding:7px 11px}h1{font-size:26px;line-height:1.3;margin:36px 0 12px;overflow-wrap:anywhere}#state{font-size:18px;font-weight:600}#state:before{content:'';display:inline-block;width:9px;height:9px;background:#96969c;border-radius:50%;margin-right:9px}#state.online:before{background:#169752}p{font-size:14px;color:#777780;line-height:1.7;overflow-wrap:anywhere}.actions{display:grid;gap:10px;margin-top:28px}a{min-height:46px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:inherit;border-radius:14px;background:#f4f4f6;padding:10px 14px;font-size:15px}a.primary{background:#171719;color:white;box-shadow:0 8px 20px -12px #0008}a:focus-visible{outline:2px solid #5367b0;outline-offset:3px}footer{display:flex;justify-content:space-between;margin-top:28px;font-size:12px;color:#85858d}#update{padding-top:16px;margin-top:20px;border-top:1px solid #eee}#update p{white-space:pre-line}progress{width:100%;accent-color:#171719}[hidden]{display:none!important}@media(prefers-reduced-motion:no-preference){.primary:active{transform:scale(.99)}}
</style><div class="brand"><i>A</i>Agent Remote</div><h1 id="name">这台电脑</h1><div id="state">正在启动</div><p id="detail" role="status"></p><p id="migration"></p>
<div class="actions"><a id="bind" class="primary" href="agentremote-action://bind">登录并绑定</a><a id="retry" class="primary" href="agentremote-action://retry" hidden>重新连接</a><a id="account" href="agentremote-action://account">账号与电脑</a><a id="legacy" href="agentremote-action://legacy">选择旧版文件夹</a><a href="agentremote-action://check-update">检查更新</a><a id="startup" href="agentremote-action://startup">登录时启动</a></div>
<section id="update" hidden><strong id="updateTitle"></strong><p id="updateNotes"></p><progress id="progress" max="100" hidden></progress><div class="actions"><a id="download" class="primary" href="agentremote-action://download" hidden>下载更新</a><a id="install" class="primary" href="agentremote-action://install" hidden>安装更新</a><a id="cancelDownload" href="agentremote-action://cancel-download" hidden>取消下载</a></div></section>
<footer><span id="version"></span><span>关闭窗口后仍在托盘运行</span></footer>
<script>window.render=s=>{document.getElementById('bind').textContent=s.rebind?'重新绑定':'登录并绑定';for(const k of ['name','state','detail','migration','version','updateTitle','updateNotes'])document.getElementById(k).textContent=s[k]||'';document.getElementById('state').className=s.online?'online':'';for(const k of ['bind','retry','account','legacy','update','download','install','cancelDownload'])document.getElementById(k).hidden=!s[k+'Visible'];document.getElementById('startup').textContent=(s.startup?'✓ ':'')+'登录时启动';document.getElementById('progress').hidden=!s.downloading;document.getElementById('progress').value=s.percent||0;};</script></html>
