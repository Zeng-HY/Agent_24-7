<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><title>Agent Remote</title>
<style>
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#171719;background:#fff}*{box-sizing:border-box}body{margin:0;padding:24px;min-width:340px}.brand{font-size:16px;font-weight:600;display:flex;align-items:center;gap:10px}.brand i{font-style:normal;background:#171719;color:white;border-radius:10px;padding:7px 11px}h1{font-size:26px;line-height:1.3;margin:36px 0 12px;overflow-wrap:anywhere}#state{font-size:18px;font-weight:600}#state:before{content:'';display:inline-block;width:9px;height:9px;background:#96969c;border-radius:50%;margin-right:9px}#state.online:before{background:#169752}p{font-size:14px;color:#777780;line-height:1.7;overflow-wrap:anywhere}.actions{display:grid;gap:10px;margin-top:28px}a{min-height:46px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:inherit;border-radius:14px;background:#f4f4f6;padding:10px 14px;font-size:15px}a.primary{background:#171719;color:white;box-shadow:0 8px 20px -12px #0008}a:focus-visible{outline:2px solid #5367b0;outline-offset:3px}footer{display:flex;justify-content:space-between;margin-top:28px;font-size:12px;color:#85858d}#update{padding-top:12px;margin-top:8px}.back{display:inline-flex;min-height:36px;background:none;padding:4px 0;color:#777780}h1{margin-top:20px}#migration:empty{display:none}#update p{white-space:pre-line}progress{width:100%;accent-color:#171719}[hidden]{display:none!important}@media(prefers-reduced-motion:no-preference){.primary:active{transform:scale(.99)}}
#updateDetails{border-top:1px solid #e8e8ed;padding-top:14px;margin:16px 0}#updateDetails summary{cursor:pointer;color:#55555f;font-size:14px;min-height:32px}#updateFullNotes{font-size:13px;line-height:1.8;color:#666670}summary:focus-visible{outline:2px solid #5367b0;outline-offset:3px}#updateTitle{display:block;font-size:22px;line-height:1.4;letter-spacing:-.3px;color:#171719}.release-highlights{margin:22px 0 18px;padding:18px 20px;background:#f5f5f7;border-radius:16px}.release-label{font-size:12px;font-weight:600;letter-spacing:1px;color:#777780}.release-highlights ul{margin:12px 0 0;padding-left:18px}.release-highlights li{padding-left:3px;margin:10px 0;font-size:15px;line-height:1.65;color:#303038}.release-highlights li:first-child{margin-top:0}.release-highlights li:last-child{margin-bottom:0}#updateFullNotes section{margin:18px 0}#updateFullNotes h3{font-size:14px;font-weight:600;margin:0 0 6px;color:#303038}#updateFullNotes p{margin:0;font-size:13px;color:#666670;line-height:1.8}#updateDetails summary{padding:6px 0;color:#303038}#update .actions{margin-top:22px}</style><h1 id="name">这台电脑</h1><div id="state">正在启动</div><p id="detail" role="status"></p><p id="migration"></p>
<div id="mainActions" class="actions"><a id="bind" class="primary" href="agentremote-action://bind">重新尝试登录</a><a id="retry" class="primary" href="agentremote-action://retry" hidden>重新连接</a></div>
<section id="update" hidden><strong id="updateTitle"></strong><div id="releaseHighlights" class="release-highlights" hidden><span class="release-label">本版变化</span><ul id="highlightList"></ul></div><p id="updateNotes"></p><details id="updateDetails" hidden><summary>更新详情</summary><div id="updateFullNotes"></div></details><progress id="progress" max="100" hidden></progress><div class="actions"><a id="download" class="primary" href="agentremote-action://download" hidden>下载更新</a><a id="install" class="primary" href="agentremote-action://install" hidden>确认安装并重启</a><a id="cancelDownload" href="agentremote-action://cancel-download" hidden>取消下载</a></div></section>
<script>window.render=s=>{document.getElementById('bind').textContent=s.rebind?'重新绑定':'重新尝试登录';for(const k of ['name','state','detail','migration','updateTitle'])document.getElementById(k).textContent=s[k]||'';const summary=document.getElementById('updateNotes');summary.textContent=s.updateNotes||'';const highlights=document.getElementById('releaseHighlights'),list=document.getElementById('highlightList');const rows=s.updateSummary&&s.updateDetails?s.updateSummary.split('\n').filter(Boolean):[];highlights.hidden=!rows.length;summary.hidden=!!rows.length;list.replaceChildren();for(const row of rows){const li=document.createElement('li');li.textContent=row;list.append(li);}const details=document.getElementById('updateDetails'),full=s.updateDetails||'';const key=(s.updateTitle||'')+'\n'+full;if(details.dataset.key!==key){details.open=false;details.dataset.key=key;}details.hidden=!full;const content=document.getElementById('updateFullNotes');content.replaceChildren();for(const block of full.split(/\n\s*\n/).filter(Boolean)){const lines=block.split('\n'),section=document.createElement('section');if(lines.length>1){const h=document.createElement('h3');h.textContent=lines.shift();section.append(h);}const p=document.createElement('p');p.textContent=lines.join('\n');section.append(p);content.append(section);}document.getElementById('state').className=s.online?'online':'';for(const k of ['bind','retry','download','install','cancelDownload'])document.getElementById(k).hidden=!s[k+'Visible'];for(const k of ['name','state','detail','migration','mainActions'])document.getElementById(k).hidden=!!s.settingsVisible;document.getElementById('update').hidden=!s.settingsVisible;document.getElementById('progress').hidden=!s.downloading;document.getElementById('progress').value=s.percent||0;};</script></html>
